name: compat

on:
  # The gate has to run where a change can still be acted on. With only push and
  # schedule here, the first signal a branch sends was the merge commit turning
  # `main` red, and a PR could land without ever having been tested.
  pull_request:
  schedule:
    - cron: '23 3 * * *'
  workflow_dispatch:
  push:
    branches: [main, dev]

concurrency:
  group: compat-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  static:
    name: static checks (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 20 is the floor `engines.node` promises, and a promise no job runs is a
        # promise that quietly stops being true. 24 is the line this plugin is
        # developed and released against.
        node: [20, 24]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
      # This repository tracks no lockfile on purpose (.gitignore: pinning
      # devDependency tarballs says nothing about a published library whose runtime
      # is plain Node ESM with zero dependencies). `npm ci` and setup-node's
      # `cache: npm` both take their input from a lockfile, so neither is available
      # here; `--ignore-scripts` is what keeps a registry-side install hook out of
      # this job.
      - name: install development dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: syntax check every module
        run: |
          set -e
          for f in lib/*.js; do node --check "$f"; done
      - name: host module exports a DSH plugin
        run: |
          node --input-type=module -e "import('./lib/index.js').then(m => { if (!m.default || typeof m.default.apply !== 'function') { console.error('missing default plugin'); process.exit(1) } })"
      - name: unit tests
        run: npm test
      - name: package contents
        run: npm pack --dry-run
      - name: manifest consistency
        shell: pwsh
        run: |
          $pkg = Get-Content package.json -Raw | ConvertFrom-Json
          if (-not $pkg.dsh.bundle.patch) { Write-Error 'dsh.bundle.patch missing' }
          if ($pkg.dsh.client.platform -ne 'web') { Write-Error 'dsh.client.platform must be web' }
          $client = Get-Content lib/client.js -Raw
          if ($client -notmatch [regex]::Escape("id: '$($pkg.name)'")) { Write-Error 'client bundle id does not match package name' }
          $patch = Get-Content cordis.patch.yml -Raw
          if ($patch -notmatch [regex]::Escape($pkg.name)) { Write-Error 'patch does not mount this package' }
          $shared = Get-Content lib/shared.js -Raw
          if ($shared -notmatch [regex]::Escape("VERSION = '$($pkg.version)'")) { Write-Error 'lib/shared.js VERSION does not match package version' }

  # The three shared host fragments are verified locally by `npm test`, which runs
  # http:check / loopback:check / guard:check against the pinned dock version. No
  # comparison against files outside this repository runs here: `dsh-plugin-parity`
  # (from the dock) is that comparison, and its verdict only means something while
  # every checkout it reads sits on the same branch, so it stays a manual diagnostic.
  #
  # This job boots the real host with this bundle mounted, on both platforms and
  # both declared host lines, and both cells assert the same payload contract after
  # the boot (the field list, the row/`nodeCount` agreement, and the anti-fabrication
  # rules). What neither cell covers, and what the unit tests carry instead: the
  # per-row shape when a CI host has no provider route and so measures 0 surface
  # nodes — the check says so on the transcript when that happens — and the plugin's
  # own embedded guard, which only runs on a host that mounts no Connection service.
  boot-check:
    name: boot DSH Web with bundle (${{ matrix.os }}, ${{ matrix.dsh-spec }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        # Cover the declared floor and the 0.1.7 API line, both pinned. There is
        # deliberately no `@latest` cell: a moving channel makes this repository's
        # main and dev go red the moment the host publishes, on a change nobody
        # here made and with nothing in the diff to point at. When every other
        # matrix cell is green and only `@latest` is failing, the red is the
        # upstream event, and a gate whose failures mean nothing gets ignored
        # when it means something. The host line is adopted on purpose instead:
        # raise `engines.dsh`, the peer and the README badge together, and this
        # matrix pins the new line as its floor.
        dsh-spec: ['@0.1.5-rc.3', '@0.1.7-rc.2']
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: install DSH
        run: npm i -g "@deepseek-ai/dsh${{ matrix.dsh-spec }}"
      - name: report the host version under test
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $root = (& npm root -g).Trim()
          $manifest = Join-Path $root '@deepseek-ai\dsh\package.json'
          if (-not (Test-Path $manifest)) { throw "no dsh manifest at $manifest" }
          $v = (Get-Content $manifest -Raw | ConvertFrom-Json).version
          Write-Host "dsh host under test: $v (${{ matrix.dsh-spec }})"
          if ($v -notmatch '^\d+\.\d+\.\d+') { throw "unreadable dsh version: $v" }
      - name: register bundle into a temporary profile
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          DSH_HOME: ${{ runner.temp }}\dshhome
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force "$env:DSH_HOME\profiles\web\node_modules" | Out-Null
          $src = (Get-Location).Path
          New-Item -ItemType Junction -Path "$env:DSH_HOME\profiles\web\node_modules\dsh-ballast" -Target $src | Out-Null
          $profileJson = @'
          {
            "name": "dsh-profile-web",
            "private": true,
            "dependencies": {},
            "dsh": { "profile": { "bundles": ["@deepseek-ai/dsh-base", "@deepseek-ai/dsh-web-app", "dsh-ballast"] } }
          }
          '@ | ConvertFrom-Json | ConvertTo-Json -Depth 10
          [System.IO.File]::WriteAllText("$env:DSH_HOME\profiles\web\package.json", $profileJson, (New-Object System.Text.UTF8Encoding($false)))
      - name: register bundle into a temporary profile (linux)
        if: runner.os == 'Linux'
        shell: bash
        env:
          DSH_HOME: ${{ runner.temp }}/dshhome
        run: |
          mkdir -p "$DSH_HOME/profiles/web/node_modules"
          ln -s "$GITHUB_WORKSPACE" "$DSH_HOME/profiles/web/node_modules/dsh-ballast"
          cat > "$DSH_HOME/profiles/web/package.json" <<'EOF'
          {
            "name": "dsh-profile-web",
            "private": true,
            "dependencies": {},
            "dsh": { "profile": { "bundles": ["@deepseek-ai/dsh-base", "@deepseek-ai/dsh-web-app", "dsh-ballast"] } }
          }
          EOF
      - name: boot and verify Ballast (windows, same field contract)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          DSH_HOME: ${{ runner.temp }}\dshhome
        run: |
          $ErrorActionPreference = 'Stop'
          $globalRoot = (& npm root -g).Trim()
          $dshBin = Join-Path $globalRoot '@deepseek-ai\dsh\lib\bin.js'
          if (-not (Test-Path $dshBin)) { throw "dsh bin not found at $dshBin" }
          $outFile = Join-Path $env:RUNNER_TEMP 'dsh-web-out.log'
          $errFile = Join-Path $env:RUNNER_TEMP 'dsh-web-err.log'
          # The host prints its launch token into its own stdout when it announces
          # the URL, and that token is a credential for the runner's web server for
          # as long as the process lives. Printing a raw log on failure therefore
          # publishes it into the workflow transcript, which is retained and readable
          # far wider than the job. Echo the log with those lines replaced instead:
          # everything a failed boot says about a token is exactly what must not
          # survive the failure path. The lines the auth step needs are read from
          # the file directly, unredacted, and never echoed.
          function Show-DshLog([string]$path) {
            if (-not (Test-Path $path)) { return "<no log at $path>" }
            ((Get-Content $path) | ForEach-Object {
              if ($_ -match '[?&]token=' -or $_ -match '(?i)launch[\s_-]?token') { '<line redacted: carried a launch token>' } else { $_ }
            }) -join "`n"
          }
          $process = Start-Process -FilePath (Get-Command node).Source -ArgumentList "`"$dshBin`"", 'web', '--port', '3131' -WindowStyle Hidden -PassThru -RedirectStandardOutput $outFile -RedirectStandardError $errFile
          try {
            # Readiness is "the port answers", not "answers 200". rc builds
            # serve the shell openly; alpha builds gate it behind a launch token
            # and answer 401 until it is redeemed, so any returned status proves
            # the host is up and only the auth step below may demand 200.
            $ready = $false
            for ($i = 0; $i -lt 60; $i++) {
              try {
                $null = Invoke-WebRequest -Uri 'http://127.0.0.1:3131/' -UseBasicParsing -TimeoutSec 3
                $ready = $true; break
              } catch {
                if ($_.Exception.Response) { $ready = $true; break }
              }
              if ($process.HasExited) { break }
              Start-Sleep -Seconds 1
            }
            if (-not $ready) { throw "dsh web did not become ready`nstdout:`n$(Show-DshLog $outFile)`nstderr:`n$(Show-DshLog $errFile)`n" }

            # Auth: redeem the announced launch token on GET / (it is honoured
            # nowhere else) to get the cookie /api/* needs. A build with no auth
            # announces the bare URL, so the token is opportunistic, never
            # required. It can reach the log after the first 401, so retry. The
            # token is read out of the log here and used in a request; nothing on
            # this path echoes the log, and the failure paths below redact it.
            $tokenPattern = [regex]'[?&]token=([^&\s]+)'
            $session = $null
            $shell = $null
            $announced = $false
            for ($i = 0; $i -lt 15 -and -not $shell; $i++) {
              $log = [string](Get-Content $outFile -Raw -ErrorAction SilentlyContinue)
              $token = $tokenPattern.Match($log)
              $announced = $token.Success
              $url = if ($token.Success) { "http://127.0.0.1:3131/?token=$($token.Groups[1].Value)" } else { 'http://127.0.0.1:3131/' }
              try {
                $response = Invoke-WebRequest -Uri $url -UseBasicParsing -TimeoutSec 5 -SessionVariable session
                if ($response.StatusCode -eq 200) { $shell = $response }
              } catch {}
              if (-not $shell) { Start-Sleep -Seconds 1 }
            }
            if (-not $shell) { throw "the web shell never answered 200 (launch token announced: $announced)`nstdout:`n$(Show-DshLog $outFile)`nstderr:`n$(Show-DshLog $errFile)`n" }
            Write-Host "web shell authenticated (launch token announced: $announced)"
            $auth = @{ WebSession = $session }

            $base = 'http://127.0.0.1:3131/dsh-ballast/api'
            $sessions = Invoke-RestMethod -Uri "${base}?action=sessions" -TimeoutSec 20 @auth
            if (-not $sessions.ok) { throw 'sessions returned an unexpected payload' }

            # The client artifact's address is not stable across the two lines:
            # rc serves /plugins/<id>/client.js, while alpha concatenates every
            # plugin into one combo URL whose handler 404s anything it did not
            # advertise (rev included). So the URL is read from the shell HTML the
            # host just injected rather than constructed here.
            $advertised = [regex]::Match($shell.Content, '["''](/?plugins/[^"'']*dsh-ballast/client\.js[^"'']*)["'']')
            if (-not $advertised.Success) { throw 'the shell HTML does not advertise the dsh-ballast client bundle' }
            $bundlePath = [System.Net.WebUtility]::HtmlDecode($advertised.Groups[1].Value)
            if (-not $bundlePath.StartsWith('/')) { $bundlePath = "/$bundlePath" }
            $client = Invoke-WebRequest -Uri "http://127.0.0.1:3131$bundlePath" -UseBasicParsing -TimeoutSec 20 @auth
            if ($client.StatusCode -ne 200) { throw "advertised bundle URL answered $($client.StatusCode)" }
            if ($client.Content -notmatch [regex]::Escape("id: 'dsh-ballast'")) { throw 'the served bundle is not the dsh-ballast client' }
            Write-Host "client bundle advertised and served ($($client.Content.Length) bytes)"

            $cookieHeader = ($session.Cookies.GetCookies([uri]'http://127.0.0.1:3131/') | ForEach-Object { "$($_.Name)=$($_.Value)" }) -join '; '
            $cookieArgs = if ($cookieHeader) { @('-H', "Cookie: $cookieHeader") } else { @() }
            function ApiCode([string]$method, [string]$url, [string[]]$curlArgs = @()) {
              & curl.exe -s -o NUL -w '%{http_code}' --noproxy '*' -X $method @cookieArgs @curlArgs $url
            }
            if ((ApiCode GET "${base}?action=measure") -ne '400') { throw 'measure without sessionId must be 400' }
            if ((ApiCode GET "${base}?action=measure&sessionId=nope") -ne '404') { throw 'measure on unknown session must be 404' }
            if ((ApiCode GET "${base}?action=not-real") -ne '400') { throw 'unknown action must be 400' }
            # The three header checks below assert the DEPLOYED request fence, not this plugin's
            # own embedded guard: a host that mounts the Connection service fences with its
            # Host/Origin rule plus the signed browser cookie, and the embedded guard only
            # runs where no Connection service is mounted. Keep them as end-to-end assertions
            # of the boundary a caller actually reaches; the guard itself is covered by the
            # unit tests (and, for the no-Connection route, by the route-level test).

            if ((ApiCode GET "${base}?action=sessions" @('-H', 'sec-fetch-site: cross-site')) -ne '403') { throw 'the deployed API must reject a cross-site request (403)' }
            if ((ApiCode GET "${base}?action=sessions" @('-H', 'Origin: https://evil.example')) -ne '403') { throw 'the deployed API must reject a foreign Origin (403)' }
            if ((ApiCode GET "${base}?action=sessions" @('-H', 'Host: rebound.example')) -ne '403') { throw 'the deployed API must reject a rebound Host (403)' }

            # --- measure happy path (M1-5) ---
            # ctx.sessions only answers for live sessions, and a bare `dsh web`
            # boot has none, so every check above is a failure path. Create one
            # through the harness's own RPC to prove the read side. The two lines
            # address it differently and neither answers the other's form: rc
            # claims the dotted endpoint /api/session.create, alpha the slashed
            # /api/session/create (endpoint segments may contain "/" since
            # packages/client/connection/src/client/rpc.ts). Probe both rather
            # than pinning a leg to a version marker that only npm guessed at.
            $created = $null
            $refused = $null
            foreach ($endpoint in @('session.create', 'session/create')) {
              $createBody = "{`"type`":`"client-request`",`"rpcId`":`"dsh-ballast-boot-check`",`"method`":`"$endpoint`",`"payload`":{`"args`":{`"request`":{}}}}"
              $response = $null
              try {
                $response = Invoke-RestMethod -Method Post -Uri "http://127.0.0.1:3131/api/$endpoint" -ContentType 'application/json' -Body $createBody @auth -TimeoutSec 60
              } catch { continue }
              if ($response.result.ok) {
                $created = [pscustomobject]@{ endpoint = $endpoint; sessionId = $response.result.value.sessionId }
                break
              }
              $refused = $response | ConvertTo-Json -Compress -Depth 8
            }
            if (-not $created) { throw "neither session-create endpoint answered: $refused" }
            $sessionId = $created.sessionId
            if (-not $sessionId) { throw "session create via /api/$($created.endpoint) returned no sessionId" }
            Write-Host "created a live session via /api/$($created.endpoint)"

            $listed = $null
            for ($i = 0; $i -lt 20; $i++) {
              $after = Invoke-RestMethod -Uri "${base}?action=sessions" -TimeoutSec 20 @auth
              if ($after.availability -ne 'available') { throw "tokenMeter/sessions never became available: $($after.availability)" }
              $listed = @($after.sessions | Where-Object { $_.sessionId -eq $sessionId })
              if ($listed.Count -gt 0) { break }
              Start-Sleep -Seconds 1
            }
            if ($listed.Count -eq 0) { throw "the created live session is not measurable: $sessionId" }
            if (-not $listed[0].title) { throw 'the session list must carry a display title' }
            if (-not $listed[0].titleSource) { throw 'the session list must say where the title came from' }

            $measured = Invoke-RestMethod -Uri "${base}?action=measure&sessionId=$sessionId" -TimeoutSec 60 @auth
            if (-not $measured.ok) { throw "measure on a live session failed: $($measured | ConvertTo-Json -Compress -Depth 8)" }
            if ($measured.sessionId -ne $sessionId) { throw 'measure echoed a different sessionId' }
            $m = $measured.measurement
            foreach ($field in @('logRevision', 'baseline', 'surfaceDeltaTokens', 'totalTokens', 'surfaceTokens', 'eventCount', 'nodeCount', 'shadowPricing', 'routePricedCount', 'rows')) {
              if ($null -eq $m.PSObject.Properties[$field]) { throw "measurement is missing $field" }
            }
            if (@($m.rows).Count -ne $m.nodeCount) { throw 'rows length must match nodeCount' }
            if (@($m.rows).Count -eq 0) {
              # A provider-free CI boot has no surface traffic, so the row
              # contract below is unreachable here. M1 shipped a fabricated Δ
              # column behind exactly this silence: say it out loud instead.
              if ($m.shadowPricing -ne 'unknown') { throw "an empty surface must report shadowPricing unknown, got $($m.shadowPricing)" }
              Write-Host '::notice::0 surface nodes - per-row shape asserts skipped here; covered by test/http.test.js against a priced surface'
            } else {
              foreach ($row in @($m.rows)) {
                foreach ($field in @('seq', 'tokens', 'heuristicTokens', 'priceDelta', 'routePriced', 'type', 'time', 'surfaceOp', 'preview')) {
                  if ($null -eq $row.PSObject.Properties[$field]) { throw "row #$($row.seq) is missing $field" }
                }
                # Anti-fabrication: a host that does not emit the shadow price
                # must yield nulls, never a delta that just equals tokens. The
                # subtraction is the trap — `tokens - $null` is `tokens` — so the
                # rule is read off the missing shadow price itself, not off the
                # delta arithmetic.
                if ($m.shadowPricing -eq 'absent' -and $null -ne $row.heuristicTokens) { throw "shadowPricing=absent but row #$($row.seq) carries a shadow price" }
                if ($m.shadowPricing -eq 'available' -and $null -eq $row.heuristicTokens) { throw "shadowPricing=available but row #$($row.seq) has no shadow price" }
                if ($null -eq $row.heuristicTokens -and ($null -ne $row.priceDelta -or $null -ne $row.routePriced)) { throw "row #$($row.seq) has no shadow price yet reports a delta or a priced flag" }
                if ($null -ne $row.priceDelta -and $row.priceDelta -ne ($row.tokens - $row.heuristicTokens)) { throw "row #$($row.seq) priceDelta does not match tokens - heuristicTokens" }
              }
            }
            if (-not $measured.title) { throw 'measure must carry the display title too' }
            Write-Host "measured live session $sessionId ($($m.nodeCount) surface nodes, shadowPricing=$($m.shadowPricing))"
            Write-Host 'compat check passed'
          } finally {
            Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
          }
      - name: boot and verify Ballast (linux, same field contract)
        if: runner.os == 'Linux'
        shell: bash
        env:
          DSH_HOME: ${{ runner.temp }}/dshhome
        run: |
          set -euo pipefail
          globalRoot="$(npm root -g)"
          dshBin="$globalRoot/@deepseek-ai/dsh/lib/bin.js"
          [ -f "$dshBin" ] || { echo "::error::dsh bin not found at $dshBin"; exit 1; }
          node "$dshBin" web --port 3131 >/tmp/dsh-web-out.log 2>/tmp/dsh-web-err.log &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          code() { curl -s -o /dev/null -w '%{http_code}' --noproxy '*' "$@"; }
          # The host announces its launch token on stdout, and that token is a
          # credential for the runner's web server for as long as the process lives.
          # A raw `cat` on the failure path would publish it into the workflow
          # transcript, which is retained and readable far more widely than the job
          # that produced it. Drop the lines that carry one; the token itself is read
          # out of the log below and used, never echoed.
          show_log() {
            for file in "$@"; do
              [ -f "$file" ] || { echo "<no log at $file>"; continue; }
              echo "--- $file"
              grep -viE '[?&]token=|launch[ _-]?token' "$file" || true
            done
          }
          ready=0
          for i in $(seq 60); do
            [ "$(code http://127.0.0.1:3131/)" != '000' ] && { ready=1; break; }
            kill -0 "$pid" 2>/dev/null || break
            sleep 1
          done
          [ "$ready" = 1 ] || { echo '::error::dsh web did not become ready'; show_log /tmp/dsh-web-out.log /tmp/dsh-web-err.log; exit 1; }

          # Alpha gates mutating /api/* routes behind a one-shot launch token.
          # Redeem the URL announced in the host log and retain its cookie; a build
          # with no auth announces the bare URL and needs nothing, so the same flow
          # is harmless there.
          cookieJar="$RUNNER_TEMP/dsh.cookies"
          shellHtml="$RUNNER_TEMP/dsh-shell.html"
          shellReady=0
          announced=0
          for i in $(seq 15); do
            token=$(sed -n 's/.*[?&]token=\([^&[:space:]]*\).*/\1/p' /tmp/dsh-web-out.log /tmp/dsh-web-err.log | tail -n 1)
            url='http://127.0.0.1:3131/'
            if [ -n "$token" ]; then url="${url}?token=${token}"; announced=1; fi
            # Invoke-WebRequest follows this redemption redirect on Windows;
            # curl needs --location or it stops at 302 after consuming the token.
            status=$(curl -sS --location --noproxy '*' -c "$cookieJar" -b "$cookieJar" -o "$shellHtml" -w '%{http_code}' "$url" || true)
            [ "$status" = 200 ] && { shellReady=1; break; }
            sleep 1
          done
          [ "$shellReady" = 1 ] || { echo "::error::web shell never answered 200 (launch token announced: $announced)"; show_log /tmp/dsh-web-out.log /tmp/dsh-web-err.log; exit 1; }
          code() { curl -s -o /dev/null -w '%{http_code}' --noproxy '*' -b "$cookieJar" "$@"; }

          base='http://127.0.0.1:3131/dsh-ballast/api'
          [ "$(code "$base?action=sessions")" = 200 ] || { echo '::error::sessions failed'; exit 1; }
          # The three header checks below assert the DEPLOYED request fence, not this plugin's
          # own embedded guard: a host that mounts the Connection service fences with its
          # Host/Origin rule plus the signed browser cookie, and the embedded guard only
          # runs where no Connection service is mounted. Keep them as end-to-end assertions
          # of the boundary a caller actually reaches; the guard itself is covered by the
          # unit tests (and, for the no-Connection route, by the route-level test).

          [ "$(code -H 'sec-fetch-site: cross-site' "$base?action=sessions")" = 403 ] || { echo '::error::the deployed API must reject a cross-site request'; exit 1; }
          [ "$(code -H 'Origin: https://evil.example' "$base?action=sessions")" = 403 ] || { echo '::error::the deployed API must reject a foreign Origin'; exit 1; }
          [ "$(code -H 'Host: evil.localhost' "$base?action=sessions")" = 403 ] || { echo '::error::the deployed API must reject a rebound Host'; exit 1; }
          [ "$(code "$base?action=measure")" = 400 ] || { echo '::error::measure without sessionId must be 400'; exit 1; }
          [ "$(code "$base?action=measure&sessionId=nope")" = 404 ] || { echo '::error::unknown session must be 404'; exit 1; }
          [ "$(code "$base?action=not-real")" = 400 ] || { echo '::error::unknown action must be 400'; exit 1; }
          created=''
          refused=''
          for endpoint in session.create session/create; do
            body=$(printf '%s' '{"type":"client-request","rpcId":"dsh-ballast-boot-check","method":"'"$endpoint"'","payload":{"args":{"request":{}}}}')
            responseFile="$RUNNER_TEMP/create-response.json"
            : > "$responseFile"
            status=$(curl -sS --noproxy '*' -b "$cookieJar" -c "$cookieJar" -o "$responseFile" -w '%{http_code}' -X POST -H 'content-type: application/json' --max-time 60 "http://127.0.0.1:3131/api/$endpoint" --data "$body" || true)
            response=$(cat "$responseFile" 2>/dev/null || true)
            created=$(printf '%s' "$response" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{try{let v=JSON.parse(s).result;if(v&&v.ok)process.stdout.write(v.value.sessionId||'')}catch{}})")
            [ -n "$created" ] && break
            refused="/api/$endpoint -> HTTP $status: $response"
          done
          [ -n "$created" ] || { echo "::error::neither session-create endpoint answered ($refused)"; exit 1; }
          listed=0
          for i in $(seq 20); do
            sessions=$(curl -s --noproxy '*' -b "$cookieJar" --max-time 20 "$base?action=sessions")
            printf '%s' "$sessions" | grep -q '"availability":"available"' || { echo '::error::tokenMeter/sessions unavailable'; exit 1; }
            printf '%s' "$sessions" | grep -q "\"sessionId\":\"$created\"" && { listed=1; break; }
            sleep 1
          done
          [ "$listed" = 1 ] || { echo "::error::created session not measurable: $created"; exit 1; }

          # The two cells now assert the same contract. The Windows one used to own
          # the field checks while this one grepped the body for `"rows"` — and a
          # body of `{"rows":[]}` satisfies that grep, so on Linux a measurement
          # missing every field, or carrying a delta that was really the token count
          # copied, went green. A grep over a JSON body states the spelling of a key,
          # not the content of it; node reads the payload the way the panel does.
          sessionsFile="$RUNNER_TEMP/sessions.json"
          curl -sS --noproxy '*' -b "$cookieJar" --max-time 20 -o "$sessionsFile" "$base?action=sessions"
          node -e '
            const fs = require("node:fs")
            const [file, sessionId] = process.argv.slice(1)
            const fail = (message) => { console.error("::error::" + message); process.exit(1) }
            let body
            try { body = JSON.parse(fs.readFileSync(file, "utf8")) } catch (e) { fail(file + " is not a JSON payload: " + e.message) }
            if (!body.ok) fail("sessions returned an unexpected payload")
            const listed = (body.sessions || []).filter((entry) => entry.sessionId === sessionId)
            if (listed.length !== 1) fail("the created live session is not in the list: " + sessionId)
            if (!listed[0].title) fail("the session list must carry a display title")
            if (!listed[0].titleSource) fail("the session list must say where the title came from")
          ' "$sessionsFile" "$created"

          measureFile="$RUNNER_TEMP/measure.json"
          curl -sS --noproxy '*' -b "$cookieJar" --max-time 60 -o "$measureFile" "$base?action=measure&sessionId=$created"
          node -e '
            const fs = require("node:fs")
            const [file, sessionId] = process.argv.slice(1)
            const fail = (message) => { console.error("::error::" + message); process.exit(1) }
            let body
            try { body = JSON.parse(fs.readFileSync(file, "utf8")) } catch (e) { fail(file + " is not a JSON payload: " + e.message) }
            if (!body.ok) fail("measure on a live session failed: " + JSON.stringify(body))
            if (body.sessionId !== sessionId) fail("measure echoed a different sessionId")
            if (!body.title) fail("measure must carry the display title too")
            const m = body.measurement
            if (!m) fail("measure answered with no measurement")
            for (const field of ["logRevision", "baseline", "surfaceDeltaTokens", "totalTokens",
              "surfaceTokens", "eventCount", "nodeCount", "shadowPricing", "routePricedCount", "rows"]) {
              if (m[field] === undefined || m[field] === null) fail("measurement is missing " + field)
            }
            if (!Array.isArray(m.rows) || m.rows.length !== m.nodeCount) fail("rows length must match nodeCount")
            if (m.rows.length === 0) {
              // A provider-free CI boot has no surface traffic, so the per-row
              // contract below is unreachable here. M1 shipped a fabricated delta
              // column behind exactly this silence: say it out loud instead.
              if (m.shadowPricing !== "unknown") fail("an empty surface must report shadowPricing unknown, got " + m.shadowPricing)
              console.log("::notice::0 surface nodes - per-row shape asserts skipped here; covered by test/http.test.js against a priced surface")
            }
            for (const row of m.rows) {
              for (const field of ["seq", "tokens", "heuristicTokens", "priceDelta", "routePriced",
                "type", "time", "surfaceOp", "preview"]) {
                if (!(field in row)) fail("row #" + row.seq + " is missing " + field)
              }
              // Anti-fabrication: a host that does not emit the shadow price must
              // yield nulls, never a delta that just equals tokens. Note the shape
              // of the trap: `tokens - null` is `tokens`, so comparing the delta
              // arithmetic alone lets a fabricated row through — the rule has to be
              // read off the missing shadow price itself.
              if (m.shadowPricing === "absent" && row.heuristicTokens !== null) fail("shadowPricing=absent but row #" + row.seq + " carries a shadow price")
              if (m.shadowPricing === "available" && row.heuristicTokens === null) fail("shadowPricing=available but row #" + row.seq + " has no shadow price")
              if (row.heuristicTokens === null && (row.priceDelta !== null || row.routePriced !== null)) fail("row #" + row.seq + " has no shadow price yet reports a delta or a priced flag")
              if (row.priceDelta !== null && row.priceDelta !== (row.tokens - row.heuristicTokens)) fail("row #" + row.seq + " priceDelta does not match tokens - heuristicTokens")
            }
            console.log("measured live session " + sessionId + " (" + m.nodeCount + " surface nodes, shadowPricing=" + m.shadowPricing + ")")
          ' "$measureFile" "$created"
          echo 'compat check passed'
