name: compat

on:
  schedule:
    - cron: '23 3 * * *'
  workflow_dispatch:
  push:
    branches: [main, dev]

concurrency:
  group: compat-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  static:
    name: static checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: install development dependencies
        run: npm install --ignore-scripts
      - name: syntax check every module
        run: |
          set -e
          for f in lib/*.js; do node --check "$f"; done
      - name: host module exports a DSH plugin
        run: |
          node --input-type=module -e "import('./lib/index.js').then(m => { if (!m.default || typeof m.default.apply !== 'function') { console.error('missing default plugin'); process.exit(1) } })"
      - name: unit tests
        run: npm test
      - name: package contents
        run: npm pack --dry-run
      - name: manifest consistency
        shell: pwsh
        run: |
          $pkg = Get-Content package.json -Raw | ConvertFrom-Json
          if (-not $pkg.dsh.bundle.patch) { Write-Error 'dsh.bundle.patch missing' }
          if ($pkg.dsh.client.platform -ne 'web') { Write-Error 'dsh.client.platform must be web' }
          $client = Get-Content lib/client.js -Raw
          if ($client -notmatch [regex]::Escape("id: '$($pkg.name)'")) { Write-Error 'client bundle id does not match package name' }
          $patch = Get-Content cordis.patch.yml -Raw
          if ($patch -notmatch [regex]::Escape($pkg.name)) { Write-Error 'patch does not mount this package' }
          $shared = Get-Content lib/shared.js -Raw
          if ($shared -notmatch [regex]::Escape("VERSION = '$($pkg.version)'")) { Write-Error 'lib/shared.js VERSION does not match package version' }

  boot-check:
    name: boot DSH Web with bundle (Windows, ${{ matrix.dsh-spec }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        # `latest` is what most installs get (0.1.1-rc.2 today); `alpha` is the
        # line package.json actually claims. Installing a bare package name
        # would only ever verify latest and leave the claim untested.
        dsh-spec: ['@alpha', '@latest']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: install DSH
        run: npm i -g "@deepseek-ai/dsh${{ matrix.dsh-spec }}"
      - name: report the host version under test
        shell: pwsh
        run: |
          $root = (& npm root -g).Trim()
          $manifest = Join-Path $root '@deepseek-ai\dsh\package.json'
          if (-not (Test-Path $manifest)) { throw "no dsh manifest at $manifest" }
          $v = (Get-Content $manifest -Raw | ConvertFrom-Json).version
          Write-Host "dsh host under test: $v (${{ matrix.dsh-spec }})"
          if ($v -notmatch '^\d+\.\d+\.\d+') { throw "unreadable dsh version: $v" }
      - name: register bundle into a temporary profile
        shell: pwsh
        env:
          DSH_HOME: ${{ runner.temp }}\dshhome
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force "$env:DSH_HOME\profiles\web\node_modules" | Out-Null
          $src = (Get-Location).Path
          New-Item -ItemType Junction -Path "$env:DSH_HOME\profiles\web\node_modules\dsh-ballast" -Target $src | Out-Null
          $profileJson = @'
          {
            "name": "dsh-profile-web",
            "private": true,
            "dependencies": {},
            "dsh": { "profile": { "bundles": ["@deepseek-ai/dsh-base", "@deepseek-ai/dsh-web-app", "dsh-ballast"] } }
          }
          '@ | ConvertFrom-Json | ConvertTo-Json -Depth 10
          [System.IO.File]::WriteAllText("$env:DSH_HOME\profiles\web\package.json", $profileJson, (New-Object System.Text.UTF8Encoding($false)))
      - name: boot and verify Ballast
        shell: pwsh
        env:
          DSH_HOME: ${{ runner.temp }}\dshhome
        run: |
          $ErrorActionPreference = 'Stop'
          $globalRoot = (& npm root -g).Trim()
          $dshBin = Join-Path $globalRoot '@deepseek-ai\dsh\lib\bin.js'
          if (-not (Test-Path $dshBin)) { throw "dsh bin not found at $dshBin" }
          $outFile = Join-Path $env:RUNNER_TEMP 'dsh-web-out.log'
          $errFile = Join-Path $env:RUNNER_TEMP 'dsh-web-err.log'
          $process = Start-Process -FilePath (Get-Command node).Source -ArgumentList "`"$dshBin`"", 'web', '--port', '3131' -WindowStyle Hidden -PassThru -RedirectStandardOutput $outFile -RedirectStandardError $errFile
          try {
            # Readiness is "the port answers", not "answers 200". rc builds
            # serve the shell openly; alpha builds gate it behind a launch token
            # and answer 401 until it is redeemed, so any returned status proves
            # the host is up and only the auth step below may demand 200.
            $ready = $false
            for ($i = 0; $i -lt 60; $i++) {
              try {
                $null = Invoke-WebRequest -Uri 'http://127.0.0.1:3131/' -UseBasicParsing -TimeoutSec 3
                $ready = $true; break
              } catch {
                if ($_.Exception.Response) { $ready = $true; break }
              }
              if ($process.HasExited) { break }
              Start-Sleep -Seconds 1
            }
            if (-not $ready) { throw "dsh web did not become ready`nstdout:`n$(Get-Content $outFile -Raw)`nstderr:`n$(Get-Content $errFile -Raw)`n" }

            # Auth: redeem the announced launch token on GET / (it is honoured
            # nowhere else) to get the cookie /api/* needs. A build with no auth
            # announces the bare URL, so the token is opportunistic, never
            # required. It can reach the log after the first 401, so retry.
            $tokenPattern = [regex]'[?&]token=([^&\s]+)'
            $session = $null
            $shell = $null
            $announced = $false
            for ($i = 0; $i -lt 15 -and -not $shell; $i++) {
              $log = [string](Get-Content $outFile -Raw -ErrorAction SilentlyContinue)
              $token = $tokenPattern.Match($log)
              $announced = $token.Success
              $url = if ($token.Success) { "http://127.0.0.1:3131/?token=$($token.Groups[1].Value)" } else { 'http://127.0.0.1:3131/' }
              try {
                $response = Invoke-WebRequest -Uri $url -UseBasicParsing -TimeoutSec 5 -SessionVariable session
                if ($response.StatusCode -eq 200) { $shell = $response }
              } catch {}
              if (-not $shell) { Start-Sleep -Seconds 1 }
            }
            if (-not $shell) { throw "the web shell never answered 200 (launch token announced: $announced)`nstdout:`n$(Get-Content $outFile -Raw)`nstderr:`n$(Get-Content $errFile -Raw)`n" }
            Write-Host "web shell authenticated (launch token announced: $announced)"
            $auth = @{ WebSession = $session }

            $base = 'http://127.0.0.1:3131/dsh-ballast/api'
            $sessions = Invoke-RestMethod -Uri "${base}?action=sessions" -TimeoutSec 20
            if (-not $sessions.ok) { throw 'sessions returned an unexpected payload' }

            # The client artifact's address is not stable across the two lines:
            # rc serves /plugins/<id>/client.js, while alpha concatenates every
            # plugin into one combo URL whose handler 404s anything it did not
            # advertise (rev included). So the URL is read from the shell HTML the
            # host just injected rather than constructed here.
            $advertised = [regex]::Match($shell.Content, '["''](/?plugins/[^"'']*dsh-ballast/client\.js[^"'']*)["'']')
            if (-not $advertised.Success) { throw 'the shell HTML does not advertise the dsh-ballast client bundle' }
            $bundlePath = [System.Net.WebUtility]::HtmlDecode($advertised.Groups[1].Value)
            if (-not $bundlePath.StartsWith('/')) { $bundlePath = "/$bundlePath" }
            $client = Invoke-WebRequest -Uri "http://127.0.0.1:3131$bundlePath" -UseBasicParsing -TimeoutSec 20 @auth
            if ($client.StatusCode -ne 200) { throw "advertised bundle URL answered $($client.StatusCode)" }
            if ($client.Content -notmatch [regex]::Escape("id: 'dsh-ballast'")) { throw 'the served bundle is not the dsh-ballast client' }
            Write-Host "client bundle advertised and served ($($client.Content.Length) bytes)"

            function ApiCode([string]$method, [string]$url, [string[]]$curlArgs = @()) {
              & curl.exe -s -o NUL -w '%{http_code}' --noproxy '*' -X $method @curlArgs $url
            }
            if ((ApiCode GET "${base}?action=measure") -ne '400') { throw 'measure without sessionId must be 400' }
            if ((ApiCode GET "${base}?action=measure&sessionId=nope") -ne '404') { throw 'measure on unknown session must be 404' }
            if ((ApiCode GET "${base}?action=not-real") -ne '400') { throw 'unknown action must be 400' }
            if ((ApiCode GET "${base}?action=sessions" @('-H', 'sec-fetch-site: cross-site')) -ne '403') { throw 'guard regression: cross-site metadata must be 403' }
            if ((ApiCode GET "${base}?action=sessions" @('-H', 'Origin: https://evil.example')) -ne '403') { throw 'guard regression: foreign Origin must be 403' }
            if ((ApiCode GET "${base}?action=sessions" @('-H', 'Host: rebound.example')) -ne '403') { throw 'guard regression: non-loopback Host must be 403' }

            # --- measure happy path (M1-5) ---
            # ctx.sessions only answers for live sessions, and a bare `dsh web`
            # boot has none, so every check above is a failure path. Create one
            # through the harness's own RPC to prove the read side. The two lines
            # address it differently and neither answers the other's form: rc
            # claims the dotted endpoint /api/session.create, alpha the slashed
            # /api/session/create (endpoint segments may contain "/" since
            # packages/client/connection/src/client/rpc.ts). Probe both rather
            # than pinning a leg to a version marker that only npm guessed at.
            $created = $null
            $refused = $null
            foreach ($endpoint in @('session.create', 'session/create')) {
              $createBody = "{`"type`":`"client-request`",`"rpcId`":`"dsh-ballast-boot-check`",`"method`":`"$endpoint`",`"payload`":{`"args`":{`"request`":{}}}}"
              $response = $null
              try {
                $response = Invoke-RestMethod -Method Post -Uri "http://127.0.0.1:3131/api/$endpoint" -ContentType 'application/json' -Body $createBody @auth -TimeoutSec 60
              } catch { continue }
              if ($response.result.ok) {
                $created = [pscustomobject]@{ endpoint = $endpoint; sessionId = $response.result.value.sessionId }
                break
              }
              $refused = $response | ConvertTo-Json -Compress -Depth 8
            }
            if (-not $created) { throw "neither session-create endpoint answered: $refused" }
            $sessionId = $created.sessionId
            if (-not $sessionId) { throw "session create via /api/$($created.endpoint) returned no sessionId" }
            Write-Host "created a live session via /api/$($created.endpoint)"

            $listed = $null
            for ($i = 0; $i -lt 20; $i++) {
              $after = Invoke-RestMethod -Uri "${base}?action=sessions" -TimeoutSec 20
              if ($after.availability -ne 'available') { throw "tokenMeter/sessions never became available: $($after.availability)" }
              $listed = @($after.sessions | Where-Object { $_.sessionId -eq $sessionId })
              if ($listed.Count -gt 0) { break }
              Start-Sleep -Seconds 1
            }
            if ($listed.Count -eq 0) { throw "the created live session is not measurable: $sessionId" }
            if (-not $listed[0].title) { throw 'the session list must carry a display title' }
            if (-not $listed[0].titleSource) { throw 'the session list must say where the title came from' }

            $measured = Invoke-RestMethod -Uri "${base}?action=measure&sessionId=$sessionId" -TimeoutSec 60
            if (-not $measured.ok) { throw "measure on a live session failed: $($measured | ConvertTo-Json -Compress -Depth 8)" }
            if ($measured.sessionId -ne $sessionId) { throw 'measure echoed a different sessionId' }
            $m = $measured.measurement
            foreach ($field in @('logRevision', 'baseline', 'surfaceDeltaTokens', 'totalTokens', 'surfaceTokens', 'eventCount', 'nodeCount', 'shadowPricing', 'routePricedCount', 'rows')) {
              if ($null -eq $m.PSObject.Properties[$field]) { throw "measurement is missing $field" }
            }
            if (@($m.rows).Count -ne $m.nodeCount) { throw 'rows length must match nodeCount' }
            if (@($m.rows).Count -eq 0) {
              # A provider-free CI boot has no surface traffic, so the row
              # contract below is unreachable here. M1 shipped a fabricated Δ
              # column behind exactly this silence: say it out loud instead.
              if ($m.shadowPricing -ne 'unknown') { throw "an empty surface must report shadowPricing unknown, got $($m.shadowPricing)" }
              Write-Host '::notice::0 surface nodes - per-row shape asserts skipped here; covered by test/http.test.js against a priced surface'
            } else {
              foreach ($row in @($m.rows)) {
                foreach ($field in @('seq', 'tokens', 'heuristicTokens', 'priceDelta', 'routePriced', 'type', 'time', 'surfaceOp', 'preview')) {
                  if ($null -eq $row.PSObject.Properties[$field]) { throw "row #$($row.seq) is missing $field" }
                }
                # Anti-fabrication: a host that does not emit the shadow price
                # must yield nulls, never a delta that just equals tokens.
                if ($m.shadowPricing -eq 'absent' -and $null -ne $row.heuristicTokens) { throw "shadowPricing=absent but row #$($row.seq) carries a shadow price" }
                if ($m.shadowPricing -eq 'available' -and $null -eq $row.heuristicTokens) { throw "shadowPricing=available but row #$($row.seq) has no shadow price" }
                if ($null -ne $row.priceDelta -and $row.priceDelta -ne ($row.tokens - $row.heuristicTokens)) { throw "row #$($row.seq) priceDelta does not match tokens - heuristicTokens" }
              }
            }
            if (-not $measured.title) { throw 'measure must carry the display title too' }
            Write-Host "measured live session $sessionId ($($m.nodeCount) surface nodes, shadowPricing=$($m.shadowPricing))"
            Write-Host 'compat check passed'
          } finally {
            Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
          }
