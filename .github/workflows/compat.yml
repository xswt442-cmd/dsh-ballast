name: compat

on:
  schedule:
    - cron: '23 3 * * *'
  workflow_dispatch:
  push:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  static:
    name: static checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: syntax check every module
        run: |
          set -e
          for f in lib/*.js; do node --check "$f"; done
      - name: host module exports a DSH plugin
        run: |
          node --input-type=module -e "import('./lib/index.js').then(m => { if (!m.default || typeof m.default.apply !== 'function') { console.error('missing default plugin'); process.exit(1) } })"
      - name: unit tests
        run: npm test
      - name: package contents
        run: npm pack --dry-run
      - name: manifest consistency
        shell: pwsh
        run: |
          $pkg = Get-Content package.json -Raw | ConvertFrom-Json
          if (-not $pkg.dsh.bundle.patch) { Write-Error 'dsh.bundle.patch missing' }
          if ($pkg.dsh.client.platform -ne 'web') { Write-Error 'dsh.client.platform must be web' }
          $client = Get-Content lib/client.js -Raw
          if ($client -notmatch [regex]::Escape("id: '$($pkg.name)'")) { Write-Error 'client bundle id does not match package name' }
          $patch = Get-Content cordis.patch.yml -Raw
          if ($patch -notmatch [regex]::Escape($pkg.name)) { Write-Error 'patch does not mount this package' }
          $shared = Get-Content lib/shared.js -Raw
          if ($shared -notmatch [regex]::Escape("VERSION = '$($pkg.version)'")) { Write-Error 'lib/shared.js VERSION does not match package version' }

  boot-check:
    name: boot DSH Web with bundle (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: install DSH
        run: npm i -g @deepseek-ai/dsh
      - name: register bundle into a temporary profile
        shell: pwsh
        env:
          DSH_HOME: ${{ runner.temp }}\dshhome
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force "$env:DSH_HOME\profiles\web\node_modules" | Out-Null
          $src = (Get-Location).Path
          New-Item -ItemType Junction -Path "$env:DSH_HOME\profiles\web\node_modules\dsh-ballast" -Target $src | Out-Null
          $profileJson = @'
          {
            "name": "dsh-profile-web",
            "private": true,
            "dependencies": {},
            "dsh": { "profile": { "bundles": ["@deepseek-ai/dsh-base", "@deepseek-ai/dsh-web-app", "dsh-ballast"] } }
          }
          '@ | ConvertFrom-Json | ConvertTo-Json -Depth 10
          [System.IO.File]::WriteAllText("$env:DSH_HOME\profiles\web\package.json", $profileJson, (New-Object System.Text.UTF8Encoding($false)))
      - name: boot and verify Ballast
        shell: pwsh
        env:
          DSH_HOME: ${{ runner.temp }}\dshhome
        run: |
          $ErrorActionPreference = 'Stop'
          $globalRoot = (& npm root -g).Trim()
          $dshBin = Join-Path $globalRoot '@deepseek-ai\dsh\lib\bin.js'
          if (-not (Test-Path $dshBin)) { throw "dsh bin not found at $dshBin" }
          $outFile = Join-Path $env:RUNNER_TEMP 'dsh-web-out.log'
          $errFile = Join-Path $env:RUNNER_TEMP 'dsh-web-err.log'
          $process = Start-Process -FilePath (Get-Command node).Source -ArgumentList "`"$dshBin`"", 'web', '--port', '3131' -WindowStyle Hidden -PassThru -RedirectStandardOutput $outFile -RedirectStandardError $errFile
          try {
            # Readiness is a plain 200 on /. The announced URL is also the only
            # way to obtain the browser auth cookie (the launch token is honored
            # on GET / and nowhere else) — but a build without auth announces the
            # bare URL, so the token is opportunistic, never required.
            $session = $null
            $ready = $false
            for ($i = 0; $i -lt 60; $i++) {
              try {
                $response = Invoke-WebRequest -Uri 'http://127.0.0.1:3131/' -UseBasicParsing -TimeoutSec 3 -SessionVariable session
                if ($response.StatusCode -eq 200) { $ready = $true; break }
              } catch {}
              if ($process.HasExited) { break }
              Start-Sleep -Seconds 1
            }
            if (-not $ready) { throw "dsh web did not become ready`nstdout:`n$(Get-Content $outFile -Raw)`nstderr:`n$(Get-Content $errFile -Raw)" }

            $token = [regex]::Match((Get-Content $outFile -Raw), '[?&]token=([^&\s]+)')
            if ($token.Success) {
              $null = Invoke-WebRequest -Uri "http://127.0.0.1:3131/?token=$($token.Groups[1].Value)" -UseBasicParsing -TimeoutSec 5 -WebSession $session
            }
            $auth = @{}
            if ($session) { $auth['WebSession'] = $session }

            $base = 'http://127.0.0.1:3131/dsh-ballast/api'
            $sessions = Invoke-RestMethod -Uri "${base}?action=sessions" -TimeoutSec 20
            if (-not $sessions.ok) { throw 'sessions returned an unexpected payload' }
            $client = Invoke-WebRequest -Uri 'http://127.0.0.1:3131/plugins/dsh-ballast/client.js' -UseBasicParsing -TimeoutSec 5
            if ($client.StatusCode -ne 200) { throw 'client bundle was not served' }

            function ApiCode([string]$method, [string]$url, [string[]]$curlArgs = @()) {
              & curl.exe -s -o NUL -w '%{http_code}' --noproxy '*' -X $method @curlArgs $url
            }
            if ((ApiCode GET "${base}?action=measure") -ne '400') { throw 'measure without sessionId must be 400' }
            if ((ApiCode GET "${base}?action=measure&sessionId=nope") -ne '404') { throw 'measure on unknown session must be 404' }
            if ((ApiCode GET "${base}?action=not-real") -ne '400') { throw 'unknown action must be 400' }
            if ((ApiCode GET "${base}?action=sessions" @('-H', 'sec-fetch-site: cross-site')) -ne '403') { throw 'guard regression: cross-site metadata must be 403' }
            if ((ApiCode GET "${base}?action=sessions" @('-H', 'Origin: https://evil.example')) -ne '403') { throw 'guard regression: foreign Origin must be 403' }
            if ((ApiCode GET "${base}?action=sessions" @('-H', 'Host: rebound.example')) -ne '403') { throw 'guard regression: non-loopback Host must be 403' }

            # --- measure happy path (M1-5) ---
            # ctx.sessions only answers for live sessions, and a bare `dsh web`
            # boot has none, so every check above is a failure path. Create one
            # through the harness's own RPC to prove the read side. Unary routes
            # are POSTed to /api/<dotted.method>, and the envelope method must
            # match the path — the slash form answers 404.
            $createBody = '{"type":"client-request","rpcId":"dsh-ballast-boot-check","method":"session.create","payload":{"args":{"request":{}}}}'
            $created = Invoke-RestMethod -Method Post -Uri 'http://127.0.0.1:3131/api/session.create' -ContentType 'application/json' -Body $createBody @auth -TimeoutSec 60
            if (-not $created.result.ok) { throw "session.create failed: $($created | ConvertTo-Json -Compress -Depth 8)" }
            $sessionId = $created.result.value.sessionId
            if (-not $sessionId) { throw 'session.create returned no sessionId' }

            $listed = $null
            for ($i = 0; $i -lt 20; $i++) {
              $after = Invoke-RestMethod -Uri "${base}?action=sessions" -TimeoutSec 20
              if ($after.availability -ne 'available') { throw "tokenMeter/sessions never became available: $($after.availability)" }
              $listed = @($after.sessions | Where-Object { $_.sessionId -eq $sessionId })
              if ($listed.Count -gt 0) { break }
              Start-Sleep -Seconds 1
            }
            if ($listed.Count -eq 0) { throw "the created live session is not measurable: $sessionId" }
            if (-not $listed[0].title) { throw 'the session list must carry a display title' }
            if (-not $listed[0].titleSource) { throw 'the session list must say where the title came from' }

            $measured = Invoke-RestMethod -Uri "${base}?action=measure&sessionId=$sessionId" -TimeoutSec 60
            if (-not $measured.ok) { throw "measure on a live session failed: $($measured | ConvertTo-Json -Compress -Depth 8)" }
            if ($measured.sessionId -ne $sessionId) { throw 'measure echoed a different sessionId' }
            $m = $measured.measurement
            foreach ($field in @('logRevision', 'baseline', 'surfaceDeltaTokens', 'totalTokens', 'surfaceTokens', 'eventCount', 'nodeCount', 'routePricedCount', 'rows')) {
              if ($null -eq $m.PSObject.Properties[$field]) { throw "measurement is missing $field" }
            }
            if (@($m.rows).Count -ne $m.nodeCount) { throw 'rows length must match nodeCount' }
            foreach ($row in @($m.rows)) {
              foreach ($field in @('seq', 'tokens', 'heuristicTokens', 'priceDelta', 'routePriced', 'type', 'time', 'surfaceOp', 'preview')) {
                if ($null -eq $row.PSObject.Properties[$field]) { throw "row #$($row.seq) is missing $field" }
              }
            }
            if (-not $measured.title) { throw 'measure must carry the display title too' }
            Write-Host "measured live session $sessionId ($($m.nodeCount) surface nodes)"
            Write-Host 'compat check passed'
          } finally {
            Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
          }
