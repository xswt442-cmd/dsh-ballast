name: publish

# Release ritual = one command: bump package.json + lib/shared.js, tag with
# `git tag -a vX.Y.Z -m '<notes>'`, push --tags. This workflow verifies the tag,
# publishes to npm with provenance, and cuts a GitHub release whose notes are
# the tag message. Annotated tags only - a lightweight tag carries no notes.

on:
  push:
    tags: ['v*']

jobs:
  publish:
    name: publish to npm
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub release
      id-token: write # npm provenance (OIDC)
    steps:
      # Full history so the annotated tag object is present locally: the release
      # step below reads its message with `git for-each-ref`.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: tag matches package.json version
        shell: bash
        run: |
          pkg=$(node -p "require('./package.json').version")
          tag=${GITHUB_REF_NAME#v}
          if [ "$pkg" != "$tag" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match package.json version ${pkg}"
            exit 1
          fi

      - name: sanity checks
        id: sanity
        shell: bash
        run: |
          tag=${GITHUB_REF_NAME#v}
          node --check lib/client.js
          node --input-type=module -e "import('./lib/index.js').then(m => { if (!m.default || typeof m.default.apply !== 'function') process.exit(1) })"
          # the self-reported version constant must match the release tag
          grep -qF "VERSION = '${tag}'" lib/shared.js || {
            echo "::error::lib/shared.js VERSION does not match tag ${tag}"
            exit 1
          }
          # no dependencies to install; this suite is what caught the fabricated
          # delta column the compat boot-check structurally cannot reach
          npm test

      - name: skip when version is already published
        id: published
        shell: bash
        run: |
          pkg=$(node -p "require('./package.json').version")
          if npm view --json "dsh-ballast@${pkg}" version > /dev/null 2>&1; then
            echo "already=yes" >> "$GITHUB_OUTPUT"
            echo "::warning::${pkg} is already on npm — nothing to publish"
          fi

      # Auth = npm Trusted Publishing (OIDC), bound to this exact repo +
      # workflow file in the package's npmjs.com settings. No token secret
      # exists; --provenance carries the OIDC exchange (needs id-token: write).
      - name: publish to npm
        if: steps.published.outputs.already != 'yes'
        run: npm publish --provenance --access public

      - name: GitHub release with tag-message notes
        if: always() && steps.sanity.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          # The tag carries its own notes, so nothing has to be kept in sync inside
          # the tree and the ritual stays one `git tag -a`. A lightweight tag has
          # no message of its own, so this reads the tagged commit's instead.
          notes=$(git for-each-ref --format='%(contents)' "refs/tags/${GITHUB_REF_NAME}")
          if [ -z "${notes//[[:space:]]/}" ]; then
            notes="Release ${GITHUB_REF_NAME}"
            echo "::warning::no usable tag message - cut annotated tags for real notes"
          fi
          # Not gated on the publish step: a version published out of band - like
          # the first one, before npm knows this package name at all - still needs
          # its notes here. Re-running once npm auth exists must converge rather
          # than fail over an occupied name, so an existing release is updated.
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            echo "::warning::release ${GITHUB_REF_NAME} already exists - refreshing its notes"
            gh release edit "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes "$notes"
          else
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes "$notes"
          fi
